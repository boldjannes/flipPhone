<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1024">
  <title>Embeddings — Admin — flipPhone</title>
  <link rel="stylesheet" href="/static/admin.css">
  <style>
    body { overflow: hidden; height: 100dvh; display: flex; flex-direction: column; }

    #app { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    #canvas-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #0d0d0d;
    }

    #embed-canvas { display: block; width: 100%; height: 100%; }

    /* ── Overlay panels ── */
    .embed-panel {
      position: absolute;
      background: rgba(20,20,20,0.92);
      border: 1px solid #333;
      backdrop-filter: blur(10px);
      padding: 10px 12px;
      color: #ddd;
      font-size: 12px;
    }

    #legend {
      top: 10px; right: 10px;
      min-width: 130px;
      max-height: calc(100% - 20px);
      overflow-y: auto;
    }
    #legend.hidden { display: none; }

    #filter-panel {
      top: 44px; left: 10px;
      min-width: 150px;
      max-height: calc(100% - 54px);
      overflow-y: auto;
    }
    #filter-panel.hidden { display: none; }

    #filter-toggle {
      position: absolute;
      top: 10px; left: 10px;
      background: rgba(20,20,20,0.92);
      border: 1px solid #444;
      color: #888;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 6px 12px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      z-index: 5;
    }
    #filter-toggle.hidden { display: none; }
    #filter-toggle:hover { color: #f0f0f0; }

    .filter-section { margin-bottom: 10px; }
    .filter-section:last-child { margin-bottom: 0; }

    .filter-title {
      font-size: 10px;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .filter-title:hover { color: #bbb; }

    .filter-check-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #ccc;
      margin-bottom: 3px;
      cursor: pointer;
      user-select: none;
    }
    .filter-check-item:last-child { margin-bottom: 0; }
    .filter-check-item input { cursor: pointer; accent-color: #00e5ff; }

    .legend-title {
      font-size: 10px;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #ddd;
      margin-bottom: 4px;
      cursor: pointer;
      padding: 2px 4px;
    }
    .legend-item:last-child { margin-bottom: 0; }
    .legend-item:hover { background: rgba(255,255,255,0.06); }

    .legend-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    #info-panel {
      bottom: 10px; left: 10px; right: 10px;
      max-height: 220px;
    }

    #info-hint {
      font-size: 12px;
      color: #555;
      text-align: center;
      padding: 2px 0;
    }

    #info-list {
      overflow-y: auto;
      max-height: 130px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      padding: 5px 0;
      border-bottom: 1px solid #2a2a2a;
    }
    .info-item:last-child { border-bottom: none; }

    .info-trick { font-weight: 700; color: #00e5ff; font-size: 13px; }
    .info-meta  { font-size: 11px; color: #666; margin-top: 1px; }

    #btn-delete {
      width: 100%;
      margin-top: 8px;
      background: #cc0000;
      color: #fff;
      border: none;
      padding: 9px;
      font-size: 12px;
      font-weight: 700;
      font-family: var(--font);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
    }
    #btn-delete:disabled { opacity: 0.45; cursor: default; }
    #btn-delete.hidden { display: none; }

    #status-bar {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #555;
      font-size: 13px;
      pointer-events: none;
      text-align: center;
      white-space: nowrap;
    }

    #toast {
      position: fixed;
      bottom: 240px; left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: #f0f0f0;
      padding: 8px 18px;
      border: 1px solid #333;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
      z-index: 50;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<header class="header">
  <a class="wordmark" href="/admin/">
    <img src="/static/flipphone_icon_bw.svg" alt="flipPhone">
    <span class="wordmark-label">Admin</span>
  </a>
  <nav class="nav-links">
    <a href="/admin/">Dashboard</a>
    <a href="/admin/training">Training</a>
    <a href="/admin/models">Models</a>
    <a href="/admin/users">Users</a>
    <a href="/admin/embed" class="active">Embeddings</a>
    <a href="/admin/recordings">Recordings</a>
  </nav>
  <div class="header-right">
    <span id="auth-status" style="font-size:12px;color:var(--dim)"></span>
    <button id="logout-btn" class="btn btn-ghost btn-sm">Logout</button>
  </div>
</header>

<div id="app">
  <div id="canvas-wrapper">
    <canvas id="embed-canvas"></canvas>

    <div id="legend" class="embed-panel hidden">
      <div class="legend-title">Tricks</div>
    </div>

    <button id="filter-toggle" class="hidden">Filter</button>
    <div id="filter-panel" class="embed-panel hidden">
      <div class="filter-section">
        <div class="filter-title" id="filter-tricks-title">
          Tricks <span id="filter-tricks-count"></span>
        </div>
        <div id="filter-tricks"></div>
      </div>
      <div class="filter-section">
        <div class="filter-title" id="filter-collectors-title">
          Collectors <span id="filter-collectors-count"></span>
        </div>
        <div id="filter-collectors"></div>
      </div>
    </div>

    <div id="info-panel" class="embed-panel">
      <div id="info-hint">Click a point to select · Shift+click to multi-select</div>
      <div id="info-list"></div>
      <button id="btn-delete" class="hidden">Delete</button>
    </div>

    <div id="status-bar"></div>
  </div>
</div>

<div id="toast"></div>

<script>
document.getElementById('logout-btn').addEventListener('click', async () => {
  const t = localStorage.getItem('fp_game_token');
  if (t) {
    await fetch('/game/api/auth/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + t } }).catch(() => {});
    localStorage.removeItem('fp_game_token');
  }
  window.location.replace('/admin/');
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="/static/admin/embed.js"></script>
</body>
</html>
