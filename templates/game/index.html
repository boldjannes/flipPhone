<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta name="theme-color" content="#f5f4f0" />
    <title>Game of Skate</title>
    <link rel="stylesheet" href="/static/shared/style.css" />
    <style>
      /* ── Design tokens (override shared/style.css dark theme) ── */
      :root {
        --bg:         #f5f4f0;
        --surface:    #ffffff;
        --surface2:   #f0efe9;
        --text:       #111111;
        --text-dim:   #888888;
        --border:     #e0dfd8;
        --accent:     #111111;
        --danger:     #c0392b;
        --success:    #2c6e49;
        --radius:     8px;
        --transition: 0.15s ease;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      *, *::before, *::after { box-sizing: border-box; }

      /* ── Auth Screen ── */
      #auth-screen {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        max-width: 480px;
        margin: 0 auto;
        padding: 0 20px;
        background: var(--bg);
      }
      #auth-screen.hidden { display: none; }

      .auth-logo {
        text-align: center;
        padding: 56px 0 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .auth-logo img {
        height: 52px;
        width: auto;
      }
      .auth-logo p {
        color: var(--text-dim);
        font-size: 0.8rem;
        letter-spacing: 0.04em;
      }

      .auth-tabs {
        display: flex;
        border: 0.5px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        margin-bottom: 20px;
      }
      .auth-tab-btn {
        flex: 1;
        padding: 12px 8px;
        background: var(--surface);
        border: none;
        color: var(--text-dim);
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        cursor: pointer;
        font-family: inherit;
      }
      .auth-tab-btn.active {
        background: var(--text);
        color: var(--bg);
      }

      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .auth-form.hidden { display: none; }

      .auth-field {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .auth-field label {
        font-size: 0.68rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--text-dim);
      }
      .auth-field input {
        background: var(--surface);
        border: 0.5px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        font-size: 0.95rem;
        padding: 12px 14px;
        outline: none;
        width: 100%;
        font-family: inherit;
      }
      .auth-field input:focus { border-color: var(--text); }

      .field-hint { font-size: 0.72rem; min-height: 1em; }
      .hint-ok { color: var(--success); }
      .hint-error { color: var(--danger); }

      .auth-error {
        font-size: 0.78rem;
        color: var(--danger);
        min-height: 1.2em;
      }

      .auth-submit-btn {
        padding: 14px;
        border-radius: var(--radius);
        border: none;
        background: var(--text);
        color: var(--bg);
        font-size: 0.75rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        cursor: pointer;
        margin-top: 4px;
        font-family: inherit;
      }
      .auth-submit-btn:disabled { opacity: 0.35; cursor: not-allowed; }

      /* ── App Shell ── */
      #app-shell {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        max-width: 480px;
        margin: 0 auto;
        background: var(--bg);
      }
      #app-shell.hidden { display: none; }

      /* ── Top Header ── */
      .app-header {
        padding: 13px 20px;
        background: var(--surface);
        border-bottom: 0.5px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
        z-index: 50;
      }
      .app-wordmark {
        flex: 1;
        display: flex;
        align-items: center;
      }
      .app-wordmark img {
        height: 28px;
        width: auto;
      }
      .header-user-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        background: none;
        border: 0.5px solid var(--border);
        border-radius: 20px;
        padding: 4px 12px 4px 4px;
        cursor: pointer;
        font-family: inherit;
      }
      .header-avatar {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--surface2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.6rem;
        font-weight: 800;
        color: var(--text);
        flex-shrink: 0;
      }
      .header-username {
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--text);
        max-width: 90px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      /* ── Profile Overlay ── */
      #profile-overlay {
        position: fixed;
        inset: 0;
        background: rgba(17, 17, 17, 0.5);
        z-index: 200;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      #profile-overlay.hidden { display: none; }
      .profile-sheet {
        background: var(--surface);
        border-top: 0.5px solid var(--border);
        width: 100%;
        max-width: 480px;
        padding: 28px 24px 36px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        position: relative;
      }
      .profile-avatar-lg {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: var(--surface2);
        border: 0.5px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        font-weight: 800;
        color: var(--text);
      }
      .profile-name { font-size: 1.1rem; font-weight: 800; color: var(--text); letter-spacing: -0.02em; }
      .profile-handle { font-size: 0.78rem; color: var(--text-dim); margin-top: -8px; }
      .profile-stats {
        display: flex;
        gap: 32px;
        padding: 16px 0;
        border-top: 0.5px solid var(--border);
        border-bottom: 0.5px solid var(--border);
        width: 100%;
        justify-content: center;
      }
      .profile-stat { text-align: center; }
      .profile-stat-val { font-size: 1.4rem; font-weight: 800; color: var(--text); letter-spacing: -0.03em; }
      .profile-stat-lbl { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-dim); }
      .profile-logout-btn {
        width: 100%;
        padding: 13px;
        border-radius: var(--radius);
        border: 0.5px solid var(--border);
        background: none;
        color: var(--text);
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        cursor: pointer;
        font-family: inherit;
      }
      .profile-close-btn {
        position: absolute;
        top: 16px;
        right: 20px;
        background: none;
        border: none;
        color: var(--text-dim);
        font-size: 1.2rem;
        cursor: pointer;
        line-height: 1;
        font-family: inherit;
      }

      /* ── Tab Content Area ── */
      .app-tab-content {
        display: none;
        flex: 1;
        flex-direction: column;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .app-tab-content.active { display: flex; }

      /* ── Bottom Nav ── */
      .bottom-nav {
        display: flex;
        background: var(--surface);
        border-top: 0.5px solid var(--border);
        flex-shrink: 0;
        padding-bottom: env(safe-area-inset-bottom, 0);
      }
      .nav-icon { display: none; }
      .nav-btn {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 14px 4px 12px;
        background: none;
        border: none;
        border-top: 2px solid transparent;
        color: var(--text-dim);
        font-size: 0.65rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        cursor: pointer;
        position: relative;
        font-family: inherit;
      }
      .nav-btn.active { color: var(--text); border-top-color: var(--text); }
      .nav-badge {
        position: absolute;
        top: 6px;
        right: calc(50% - 22px);
        background: var(--danger);
        color: #fff;
        font-size: 0.55rem;
        font-weight: 800;
        min-width: 14px;
        height: 14px;
        line-height: 14px;
        border-radius: 7px;
        text-align: center;
        padding: 0 3px;
      }
      .nav-badge.hidden { display: none; }

      /* ── Home Tab ── */
      .home-section { padding: 20px 20px 8px; }
      .home-section-title {
        font-size: 0.65rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--text-dim);
        margin-bottom: 12px;
      }

      .home-game-card {
        background: var(--surface);
        border: 0.5px solid var(--border);
        border-radius: var(--radius);
        padding: 14px 16px;
        margin-bottom: 8px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .home-game-top { display: flex; align-items: center; gap: 12px; }
      .home-game-info { flex: 1; min-width: 0; }
      .home-game-opponent { font-size: 0.9rem; font-weight: 700; color: var(--text); }
      .home-game-role { font-size: 0.72rem; color: var(--text-dim); margin-top: 2px; }
      .home-game-role.role-active { color: var(--text); font-weight: 700; }
      .home-game-line { font-size: 0.68rem; color: var(--text-dim); margin-top: 2px; }

      .home-game-stands { display: flex; gap: 16px; }
      .skate-letters { display: flex; align-items: center; gap: 3px; }
      .skate-label {
        font-size: 0.6rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-dim);
        margin-right: 3px;
      }
      .skate-char {
        width: 22px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.65rem;
        font-weight: 800;
        color: var(--border);
        background: var(--surface2);
        border-radius: 3px;
      }
      .skate-char.skate-active { color: var(--bg); background: var(--text); }

      .home-game-btn {
        padding: 11px;
        border-radius: var(--radius);
        border: none;
        background: var(--text);
        color: var(--bg);
        font-size: 0.72rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        cursor: pointer;
        width: 100%;
        font-family: inherit;
      }

      .home-invite-card {
        background: var(--surface);
        border: 0.5px solid var(--border);
        border-radius: var(--radius);
        padding: 14px 16px;
        margin-bottom: 8px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      .home-invite-card.fade-out { opacity: 0; transform: translateX(40px); }
      .home-invite-row { display: flex; align-items: center; gap: 12px; }
      .home-invite-actions { display: flex; gap: 8px; }
      .home-invite-actions .friend-action-btn { flex: 1; padding: 10px; text-align: center; }

      .home-friend-scroller {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 8px;
        scrollbar-width: none;
      }
      .home-friend-scroller::-webkit-scrollbar { display: none; }
      .home-friend-item {
        flex-shrink: 0;
        width: 84px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .home-friend-name {
        font-size: 0.68rem;
        font-weight: 600;
        color: var(--text);
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
      }
      .home-challenge-btn {
        padding: 4px 8px;
        border-radius: 4px;
        border: none;
        background: var(--text);
        color: var(--bg);
        font-size: 0.6rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        cursor: pointer;
        white-space: nowrap;
        font-family: inherit;
      }

      .avatar-circle {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--surface2);
        border: 0.5px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.7rem;
        font-weight: 800;
        color: var(--text);
        flex-shrink: 0;
      }
      .avatar-circle.avatar-md { width: 40px; height: 40px; font-size: 0.72rem; }
      .avatar-circle.avatar-lg { width: 50px; height: 50px; font-size: 0.88rem; }

      .home-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 64px 20px;
        gap: 8px;
      }
      .home-empty-icon { display: none; }
      .home-empty-text {
        font-size: 0.95rem;
        font-weight: 800;
        color: var(--text);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .home-empty-hint {
        font-size: 0.8rem;
        color: var(--text-dim);
        text-align: center;
        max-width: 260px;
        line-height: 1.5;
      }

      .home-sent-invite-card {
        background: var(--surface);
        border: 0.5px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 16px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .home-sent-invite-card .home-game-info { flex: 1; }
      .home-sent-badge {
        font-size: 0.6rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-dim);
        background: var(--surface2);
        border: 0.5px solid var(--border);
        border-radius: 3px;
        padding: 3px 6px;
        white-space: nowrap;
      }

      /* ── Game Screen Overlay ── */
      #game-screen {
        position: fixed;
        inset: 0;
        z-index: 300;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        max-width: 480px;
        margin: 0 auto;
      }
      #game-screen.hidden { display: none; }
      #gs-content {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        display: flex;
        flex-direction: column;
        padding: 16px 20px env(safe-area-inset-bottom, 16px);
        gap: 16px;
      }
      .gs-loading {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-dim);
        font-size: 0.85rem;
      }
      .gs-back-btn {
        background: none;
        border: none;
        color: var(--text-dim);
        font-size: 0.68rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        cursor: pointer;
        padding: 0;
        align-self: flex-start;
        font-family: inherit;
      }

      .gs-skate-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 12px 0;
        border-top: 0.5px solid var(--border);
        border-bottom: 0.5px solid var(--border);
      }
      .gs-skate-side { display: flex; flex-direction: column; align-items: center; gap: 4px; }
      .gs-skate-name {
        font-size: 0.6rem;
        font-weight: 700;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        max-width: 100px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .gs-skate-name.gs-skate-me { color: var(--text); }
      .gs-vs { font-size: 0.6rem; font-weight: 800; color: var(--border); letter-spacing: 0.1em; }
      .gs-skate-letters { display: flex; gap: 3px; }
      .gs-skate-ch {
        width: 24px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.72rem;
        font-weight: 800;
        color: var(--border);
        background: var(--surface);
        border: 0.5px solid var(--border);
        border-radius: 4px;
      }
      .gs-skate-ch.gs-ch-active { color: var(--bg); background: var(--text); border-color: var(--text); }
      .gs-skate-ch.gs-ch-stamp { animation: gsStamp 0.4s ease-out; }
      @keyframes gsStamp {
        0% { transform: scale(2); opacity: 0; }
        60% { transform: scale(0.9); }
        100% { transform: scale(1); opacity: 1; }
      }

      .gs-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--surface2);
        border: 0.5px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.72rem;
        font-weight: 800;
        color: var(--text);
        flex-shrink: 0;
      }

      .gs-title { font-size: 1.1rem; font-weight: 800; color: var(--text); text-align: center; letter-spacing: -0.02em; }
      .gs-subtitle { font-size: 0.78rem; color: var(--text-dim); text-align: center; margin-top: -8px; }

      .gs-pill-area, .gs-line-display {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        min-height: 36px;
      }
      .gs-trick-pill {
        padding: 6px 13px;
        border-radius: 4px;
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border: 0.5px solid var(--border);
        background: var(--surface);
        color: var(--text-dim);
      }
      .gs-pill-current {
        border-color: var(--text);
        color: var(--text);
        animation: gsPillBlink 1.4s ease-in-out infinite;
      }
      @keyframes gsPillBlink {
        0%, 100% { border-color: var(--text); color: var(--text); }
        50% { border-color: var(--border); color: var(--text-dim); }
      }
      .gs-pill-done { border-color: var(--text); background: var(--text); color: var(--bg); }
      .gs-pill-failed { border-color: var(--danger); color: var(--danger); }
      .gs-pill-check { margin-right: 3px; }
      .gs-pill-x { color: var(--danger); margin-right: 3px; }

      .gs-counter {
        text-align: center;
        font-size: 0.68rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-dim);
      }

      .gs-perm-banner {
        background: var(--surface);
        border: 0.5px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 16px;
        font-size: 0.8rem;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .gs-perm-btn {
        margin-left: auto;
        padding: 6px 12px;
        background: var(--text);
        color: var(--bg);
        border: none;
        border-radius: 4px;
        font-weight: 700;
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        cursor: pointer;
        font-family: inherit;
      }

      .gs-status { text-align: center; font-size: 0.8rem; color: var(--text-dim); min-height: 1.2em; }

      .gs-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: auto;
        padding-top: 12px;
      }
      .gs-record-btn {
        width: 100%;
        padding: 16px;
        border-radius: var(--radius);
        border: 2px solid var(--text);
        background: var(--bg);
        color: var(--text);
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        cursor: pointer;
        font-family: inherit;
      }
      .gs-record-btn:active { opacity: 0.65; }
      .gs-record-btn:disabled { opacity: 0.3; cursor: not-allowed; }
      .gs-btn-recording {
        border-color: var(--danger);
        color: var(--danger);
        animation: gsRecPulse 1.2s ease-in-out infinite;
      }
      @keyframes gsRecPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      .gs-submit-btn {
        width: 100%;
        padding: 16px;
        border-radius: var(--radius);
        border: none;
        background: var(--text);
        color: var(--bg);
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        cursor: pointer;
        font-family: inherit;
      }
      .gs-submit-btn:disabled { opacity: 0.35; }

      .gs-result-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        padding: 20px 0;
      }
      .gs-result-icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        font-weight: 800;
        font-style: normal;
      }
      .gs-result-icon.gs-result-success { background: var(--text); color: var(--bg); }
      .gs-result-icon.gs-result-fail { background: var(--surface); color: var(--text); border: 0.5px solid var(--border); }
      .gs-result-title { font-size: 1.25rem; font-weight: 800; color: var(--text); letter-spacing: -0.02em; }
      .gs-result-text { font-size: 0.85rem; color: var(--text-dim); }
      .gs-result-letter {
        font-size: 2.2rem;
        font-weight: 900;
        color: var(--text);
        animation: gsStamp 0.5s ease-out;
        letter-spacing: -0.03em;
      }
      .gs-result-stand { display: flex; gap: 4px; margin: 8px 0; }
      .gs-result-gameover {
        font-size: 0.95rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text);
        margin-top: 8px;
      }
      .gs-ok-btn {
        width: 100%;
        max-width: 280px;
        padding: 16px;
        border-radius: var(--radius);
        border: none;
        background: var(--text);
        color: var(--bg);
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        cursor: pointer;
        margin-top: 12px;
        font-family: inherit;
      }

      .gs-waiting-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        text-align: center;
      }
      .gs-waiting-avatar {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: var(--surface2);
        border: 0.5px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        font-weight: 800;
        color: var(--text);
      }
      .gs-waiting-text { font-size: 0.85rem; color: var(--text-dim); }
      .gs-waiting-pulse { display: flex; gap: 6px; }
      .gs-pulse-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--text-dim);
        animation: gsDotPulse 1.2s ease-in-out infinite;
      }
      @keyframes gsDotPulse {
        0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
        40% { opacity: 1; transform: scale(1.2); }
      }

      .gs-trick-ref {
        background: var(--surface);
        border: 0.5px solid var(--border);
        border-left: 3px solid var(--text);
        border-radius: var(--radius);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .gs-trick-ref-label {
        font-size: 0.6rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--text-dim);
      }
      .gs-trick-ref-name { font-size: 1.15rem; font-weight: 800; color: var(--text); letter-spacing: -0.02em; }
      .gs-trick-ref-hint { font-size: 0.75rem; color: var(--text-dim); line-height: 1.45; margin-top: 2px; }

      .gs-waiting-context {
        background: var(--surface);
        border: 0.5px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 16px;
        width: 100%;
        max-width: 320px;
        text-align: center;
      }
      .gs-waiting-context-label {
        font-size: 0.6rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-dim);
        margin-bottom: 8px;
      }
      .gs-waiting-pills { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
      .gs-waiting-pill {
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 0.68rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        background: var(--surface2);
        border: 0.5px solid var(--border);
        color: var(--text-dim);
      }

      .gs-detect-flash {
        border-radius: var(--radius);
        padding: 14px 16px;
        text-align: center;
        animation: gsFlashIn 0.2s ease-out;
        border: 0.5px solid var(--border);
        background: var(--surface);
      }
      .gs-detect-flash.gs-detect-ok { border-left: 3px solid var(--text); }
      .gs-detect-flash.gs-detect-fail { border-left: 3px solid var(--danger); }
      .gs-detect-trick { font-size: 0.95rem; font-weight: 800; color: var(--text); letter-spacing: -0.01em; }
      .gs-detect-conf { font-size: 0.7rem; color: var(--text-dim); margin-top: 3px; }
      @keyframes gsFlashIn {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* ── Toast ── */
      #toast {
        position: fixed;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 68px);
        left: 50%;
        transform: translateX(-50%) translateY(8px);
        background: var(--text);
        color: var(--bg);
        padding: 9px 18px;
        border-radius: 4px;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        opacity: 0;
        transition: opacity 0.2s ease, transform 0.2s ease;
        pointer-events: none;
        z-index: 500;
        white-space: nowrap;
        max-width: calc(100vw - 40px);
      }
      #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      /* ── Friends Tab ── */
      .requests-banner {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--surface);
        border: 0.5px solid var(--border);
        border-left: 3px solid var(--text);
        border-radius: var(--radius);
        padding: 10px 14px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      .requests-banner-count {
        background: var(--text);
        color: var(--bg);
        font-size: 0.65rem;
        font-weight: 800;
        min-width: 20px;
        height: 20px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        padding: 0 4px;
      }
      .requests-banner-text {
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--text);
        flex: 1;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .requests-banner-arrow { color: var(--text-dim); font-size: 0.85rem; }

      .friends-section { padding: 16px 20px; }
      .friends-section-title {
        font-size: 0.65rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--text-dim);
        margin-bottom: 10px;
      }

      #friend-search-input {
        width: 100%;
        background: var(--surface);
        border: 0.5px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        font-size: 0.88rem;
        padding: 11px 14px;
        outline: none;
        margin-bottom: 10px;
        font-family: inherit;
      }
      #friend-search-input:focus { border-color: var(--text); }

      .friend-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 0.5px solid var(--border);
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      .friend-row:last-child { border-bottom: none; }
      .friend-row.fade-out { opacity: 0; transform: translateX(40px); }

      .friend-info { flex: 1; min-width: 0; }
      .friend-name {
        font-size: 0.88rem;
        font-weight: 700;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .friend-meta {
        font-size: 0.7rem;
        color: var(--text-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 1px;
      }

      .request-actions { display: flex; gap: 6px; flex-shrink: 0; }

      .friend-action-btn {
        padding: 6px 11px;
        border-radius: 4px;
        border: none;
        font-size: 0.68rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        cursor: pointer;
        white-space: nowrap;
        font-family: inherit;
      }
      .friend-action-btn.disabled { opacity: 0.4; cursor: not-allowed; }
      .accent-btn { background: var(--text); color: var(--bg); }
      .accept-btn { background: var(--text); color: var(--bg); }
      .decline-btn { background: var(--surface); border: 0.5px solid var(--border); color: var(--text-dim); }

      .friends-empty {
        text-align: center;
        color: var(--text-dim);
        font-size: 0.78rem;
        padding: 20px 0;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .friends-divider { height: 0.5px; background: var(--border); }

      @media (min-width: 480px) {
        #auth-screen, #app-shell {
          border-left: 0.5px solid var(--border);
          border-right: 0.5px solid var(--border);
        }
      }
    </style>
  </head>
  <body>

    <!-- ════════ AUTH SCREEN ════════ -->
    <div id="auth-screen" class="hidden">
      <div class="auth-logo">
        <img src="/static/flipphone_icon_bw.svg" alt="flipPhone" />
        <p>Flip your phone. Land tricks. Challenge friends.</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab-btn active" data-tab="login">Login</button>
        <button class="auth-tab-btn" data-tab="register">Register</button>
      </div>

      <!-- Login -->
      <form id="login-form" class="auth-form" autocomplete="on">
        <div class="auth-field">
          <label for="login-username">Username</label>
          <input id="login-username" type="text" autocomplete="username" required />
        </div>
        <div class="auth-field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" autocomplete="current-password" required />
        </div>
        <div class="auth-error"></div>
        <button id="login-btn" class="auth-submit-btn" type="submit">Login</button>
      </form>

      <!-- Register -->
      <form id="register-form" class="auth-form hidden" autocomplete="on">
        <div class="auth-field">
          <label for="reg-username">Username</label>
          <input id="reg-username" type="text" autocomplete="username" placeholder="a-z, 0-9, _ (3-20)" required />
          <span id="reg-username-hint" class="field-hint"></span>
        </div>
        <div class="auth-field">
          <label for="reg-display-name">Display Name <span style="font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
          <input id="reg-display-name" type="text" autocomplete="name" />
        </div>
        <div class="auth-field">
          <label for="reg-password">Password</label>
          <input id="reg-password" type="password" autocomplete="new-password" placeholder="min. 8 characters" required />
        </div>
        <div class="auth-field">
          <label for="reg-confirm">Confirm Password</label>
          <input id="reg-confirm" type="password" autocomplete="new-password" required />
        </div>
        <div class="auth-error"></div>
        <button id="register-btn" class="auth-submit-btn" type="submit">Create Account</button>
      </form>
    </div>

    <!-- ════════ APP SHELL ════════ -->
    <div id="app-shell" class="hidden">

      <!-- Top Header -->
      <div class="app-header">
        <div class="app-wordmark">
          <img src="/static/flipphone_icon_bw.svg" alt="flipPhone" />
        </div>
        <button id="header-user-btn" class="header-user-btn">
          <div id="header-avatar" class="header-avatar"></div>
          <span id="header-username" class="header-username"></span>
        </button>
      </div>

      <!-- Home Tab -->
      <div id="tab-home" class="app-tab-content active">
        <div id="home-content"></div>
      </div>

      <!-- Games Tab (placeholder for Phase 3) -->
      <div id="tab-games" class="app-tab-content">
        <div id="games-content" style="padding:20px;color:var(--text-dim);text-align:center;padding-top:60px;">
          Spiele-Liste kommt hier hin
        </div>
      </div>

      <!-- Friends Tab -->
      <div id="tab-friends" class="app-tab-content">
        <!-- Incoming requests banner (shown when count > 0) -->
        <div class="friends-section" id="requests-banner-section" style="padding-bottom:0">
          <div id="requests-banner" class="requests-banner hidden">
            <span id="requests-banner-count" class="requests-banner-count">0</span>
            <span class="requests-banner-text">Offene Freundschaftsanfragen</span>
            <span class="requests-banner-arrow">›</span>
          </div>
        </div>

        <!-- Search -->
        <div class="friends-section">
          <div class="friends-section-title">Nutzer suchen</div>
          <input id="friend-search-input" type="text" placeholder="Username oder Name..." />
          <div id="search-results"></div>
        </div>
        <div class="friends-divider"></div>

        <!-- Incoming requests (collapsible) -->
        <div class="friends-section" id="requests-section">
          <div class="friends-section-title">Anfragen erhalten</div>
          <div id="requests-list"></div>
        </div>
        <div class="friends-divider"></div>

        <!-- Sent requests -->
        <div class="friends-section" id="sent-requests-section">
          <div class="friends-section-title">Anfragen gesendet</div>
          <div id="sent-requests-list"></div>
        </div>
        <div class="friends-divider"></div>

        <!-- Friends list -->
        <div class="friends-section">
          <div class="friends-section-title">Freunde</div>
          <div id="friends-list"></div>
        </div>
      </div>

      <!-- Bottom Navigation -->
      <nav class="bottom-nav">
        <button class="nav-btn active" data-nav="home">
          <span class="nav-icon">&#9750;</span>
          Home
        </button>
        <button class="nav-btn" data-nav="games">
          <span class="nav-icon">&#9889;</span>
          Spiele
          <span id="games-badge" class="nav-badge hidden"></span>
        </button>
        <button class="nav-btn" data-nav="friends">
          <span class="nav-icon">&#9734;</span>
          Freunde
          <span id="requests-badge" class="nav-badge hidden"></span>
        </button>
      </nav>

    </div>

    <!-- ════════ GAME SCREEN (fullscreen overlay) ════════ -->
    <div id="game-screen" class="hidden">
      <div id="gs-content"></div>
    </div>

    <!-- ════════ PROFILE OVERLAY ════════ -->
    <div id="profile-overlay" class="hidden">
      <div class="profile-sheet">
        <button id="profile-close-btn" class="profile-close-btn">&times;</button>
        <div id="profile-avatar" class="profile-avatar-lg"></div>
        <div id="profile-display-name" class="profile-name"></div>
        <div id="profile-handle" class="profile-handle"></div>
        <div class="profile-stats">
          <div class="profile-stat">
            <div id="profile-tricks" class="profile-stat-val">0</div>
            <div class="profile-stat-lbl">Tricks</div>
          </div>
          <div class="profile-stat">
            <div id="profile-wins" class="profile-stat-val">0</div>
            <div class="profile-stat-lbl">Wins</div>
          </div>
          <div class="profile-stat">
            <div id="profile-losses" class="profile-stat-val">0</div>
            <div class="profile-stat-lbl">Losses</div>
          </div>
        </div>
        <button id="profile-logout-btn" class="profile-logout-btn">Logout</button>
      </div>
    </div>

    <div id="toast"></div>

    <script src="/static/shared/sensor.js"></script>
    <script src="/static/game/auth.js"></script>
    <script src="/static/game/friends.js"></script>
    <script src="/static/game/home.js"></script>
    <script src="/static/game/game-recorder.js"></script>
    <script src="/static/game/game-screen.js"></script>
    <script src="/static/game/notifications.js"></script>
    <script src="/static/game/poller.js"></script>
    <script>
      // ── Toast ──
      let _toastTimer = null;
      function showToast(msg, duration = 2800) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(_toastTimer);
        _toastTimer = setTimeout(() => t.classList.remove("show"), duration);
      }

      // ── Navigate to game screen ──
      function navigateToGame(gameId) {
        openGame(gameId);
      }

      let gamePoller = null;

      // ── Bottom nav switching ──
      function switchNav(tab) {
        document.querySelectorAll(".nav-btn").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll(".app-tab-content").forEach((c) => c.classList.remove("active"));
        const btn = document.querySelector(`.nav-btn[data-nav="${tab}"]`);
        if (btn) btn.classList.add("active");
        const panel = document.getElementById("tab-" + tab);
        if (panel) panel.classList.add("active");

        if (tab === "home") loadHomeTab();
        if (tab === "friends") initFriends();
      }

      document.querySelectorAll(".nav-btn").forEach((btn) => {
        btn.addEventListener("click", () => switchNav(btn.dataset.nav));
      });

      // ── Profile overlay ──
      document.getElementById("header-user-btn").addEventListener("click", () => {
        const user = getCachedUser();
        if (!user) return;
        const name = user.display_name || user.username;
        document.getElementById("profile-avatar").textContent = name.slice(0, 2).toUpperCase();
        document.getElementById("profile-display-name").textContent = name;
        document.getElementById("profile-handle").textContent = "@" + user.username;
        document.getElementById("profile-tricks").textContent = user.tricks_landed || 0;
        document.getElementById("profile-wins").textContent = user.games_won || 0;
        document.getElementById("profile-losses").textContent = user.games_lost || 0;
        document.getElementById("profile-overlay").classList.remove("hidden");
      });

      document.getElementById("profile-close-btn").addEventListener("click", () => {
        document.getElementById("profile-overlay").classList.add("hidden");
      });

      document.getElementById("profile-overlay").addEventListener("click", (e) => {
        if (e.target.id === "profile-overlay") {
          document.getElementById("profile-overlay").classList.add("hidden");
        }
      });

      // ── Logout (from profile sheet) ──
      document.getElementById("profile-logout-btn").addEventListener("click", async () => {
        document.getElementById("profile-overlay").classList.add("hidden");
        if (gamePoller) gamePoller.stop();
        destroyFriends();
        await logout();
        showAuth();
      });

      // ── Hook into loadApp ──
      const _origLoadApp = loadApp;
      loadApp = function () {
        _origLoadApp();

        // Populate header
        const user = getCachedUser();
        if (user) {
          const name = user.display_name || user.username;
          document.getElementById("header-avatar").textContent = name.slice(0, 2).toUpperCase();
          document.getElementById("header-username").textContent = name;
        }

        const myId = user ? user.id : null;

        // Start poller
        if (gamePoller) gamePoller.stop();
        gamePoller = new GamePoller((data) => {
          // Update badges
          const reqBadge = document.getElementById("requests-badge");
          if (reqBadge) {
            reqBadge.textContent = data.friend_requests_count || "";
            reqBadge.classList.toggle("hidden", !data.friend_requests_count);
          }
          const gamesBadge = document.getElementById("games-badge");
          if (gamesBadge) {
            gamesBadge.textContent = data.my_turn_count || "";
            gamesBadge.classList.toggle("hidden", !data.my_turn_count);
          }

          // Update home tab
          updateHome(data);
        }, myId);
        gamePoller.start();

        // Load home tab initially
        loadHomeTab();
      };
    </script>
  </body>
</html>
