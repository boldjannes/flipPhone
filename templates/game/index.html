<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Game of Skate</title>
    <link rel="stylesheet" href="/static/shared/style.css" />
    <style>
      /* ── Design tokens ── */
      :root {
        --bg:      #ffffff;
        --text:    #111111;
        --dim:     #888888;
        --border:  #111111;
        --accent:  #1a4fd6;
        --danger:  #cc0000;
        --font:    'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
      }
      *, *::before, *::after { box-sizing: border-box; }

      /* ── Auth Screen ── */
      #auth-screen {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        max-width: 480px;
        margin: 0 auto;
        padding: 0 16px;
        background: var(--bg);
      }
      #auth-screen.hidden { display: none; }

      .auth-logo {
        padding: 48px 0 24px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
      .auth-logo img { height: 56px; width: auto; }
      .auth-logo p {
        color: var(--dim);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .auth-tabs {
        display: flex;
        border: 1.5px solid var(--border);
        margin-bottom: 16px;
      }
      .auth-tab-btn {
        flex: 1;
        padding: 11px 8px;
        background: var(--bg);
        border: none;
        color: var(--dim);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        cursor: pointer;
        font-family: var(--font);
      }
      .auth-tab-btn.active { background: var(--text); color: var(--bg); }

      .auth-form { display: flex; flex-direction: column; gap: 12px; }
      .auth-form.hidden { display: none; }

      .auth-field { display: flex; flex-direction: column; gap: 4px; }
      .auth-field label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--dim);
      }
      .auth-field input {
        background: var(--bg);
        border: 1.5px solid var(--border);
        border-radius: 0;
        color: var(--text);
        font-size: 14px;
        font-weight: 500;
        padding: 10px 12px;
        outline: none;
        width: 100%;
        font-family: var(--font);
      }
      .auth-field input:focus { border-color: var(--accent); }

      .field-hint { font-size: 11px; min-height: 1em; }
      .hint-ok { color: #2c6e49; }
      .hint-error { color: var(--danger); }

      .auth-error {
        font-size: 11px;
        color: var(--danger);
        min-height: 1.2em;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .auth-submit-btn {
        padding: 14px;
        border-radius: 0;
        border: 1.5px solid var(--border);
        background: var(--text);
        color: var(--bg);
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        cursor: pointer;
        margin-top: 4px;
        font-family: var(--font);
        width: 100%;
      }
      .auth-submit-btn:disabled { opacity: 0.35; cursor: not-allowed; }

      /* ── App Shell ── */
      #app-shell {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        max-width: 480px;
        margin: 0 auto;
        background: var(--bg);
      }
      #app-shell.hidden { display: none; }

      /* ── Top Header ── */
      .app-header {
        padding: 10px 16px;
        background: var(--bg);
        border-bottom: 1.5px solid var(--text);
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
        z-index: 50;
      }
      .app-wordmark { flex: 1; display: flex; align-items: center; }
      .app-wordmark img { height: 32px; width: auto; }
      .header-user-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        background: none;
        border: 1.5px solid var(--text);
        border-radius: 0;
        padding: 5px 12px 5px 5px;
        cursor: pointer;
        font-family: var(--font);
      }
      .header-avatar {
        width: 26px;
        height: 26px;
        background: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        font-weight: 700;
        color: var(--bg);
        flex-shrink: 0;
        letter-spacing: 0.04em;
      }
      .header-username {
        font-size: 11px;
        font-weight: 700;
        color: var(--text);
        max-width: 90px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      /* ── Profile Overlay ── */
      #profile-overlay {
        position: fixed;
        inset: 0;
        background: rgba(17, 17, 17, 0.7);
        z-index: 200;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      #profile-overlay.hidden { display: none; }
      .profile-sheet {
        background: var(--bg);
        border-top: 1.5px solid var(--text);
        width: 100%;
        max-width: 480px;
        padding: 24px 20px 36px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        position: relative;
      }
      .profile-avatar-lg {
        width: 56px;
        height: 56px;
        background: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--bg);
        letter-spacing: 0.04em;
      }
      .profile-name { font-size: 24px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
      .profile-handle { font-size: 11px; color: var(--dim); margin-top: -6px; text-transform: uppercase; letter-spacing: 0.08em; }
      .profile-stats {
        display: flex;
        border: 1.5px solid var(--text);
        width: 100%;
      }
      .profile-stat {
        flex: 1;
        text-align: center;
        padding: 12px 8px;
        border-right: 1.5px solid var(--text);
      }
      .profile-stat:last-child { border-right: none; }
      .profile-stat-val { font-size: 24px; font-weight: 700; color: var(--text); letter-spacing: -0.03em; line-height: 1; }
      .profile-stat-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--dim); margin-top: 3px; }
      .profile-logout-btn {
        width: 100%;
        padding: 13px;
        border-radius: 0;
        border: 1.5px solid var(--text);
        background: none;
        color: var(--text);
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        cursor: pointer;
        font-family: var(--font);
      }
      .profile-close-btn {
        position: absolute;
        top: 14px;
        right: 16px;
        background: none;
        border: none;
        color: var(--dim);
        font-size: 1.2rem;
        cursor: pointer;
        font-family: var(--font);
      }

      /* ── Tab Content Area ── */
      .app-tab-content {
        display: none;
        flex: 1;
        flex-direction: column;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .app-tab-content.active { display: flex; }

      /* ── Bottom Nav ── */
      .bottom-nav {
        display: flex;
        background: var(--bg);
        border-top: 1.5px solid var(--text);
        flex-shrink: 0;
        padding-bottom: env(safe-area-inset-bottom, 0);
      }
      .nav-icon { display: none; }
      .nav-btn {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 13px 4px 11px;
        background: none;
        border: none;
        border-top: 3px solid transparent;
        color: var(--dim);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        cursor: pointer;
        position: relative;
        font-family: var(--font);
      }
      .nav-btn.active { color: var(--text); border-top-color: var(--accent); }
      .nav-badge {
        position: absolute;
        top: 5px;
        right: calc(50% - 22px);
        background: var(--danger);
        color: #fff;
        font-size: 9px;
        font-weight: 700;
        min-width: 14px;
        height: 14px;
        line-height: 14px;
        text-align: center;
        padding: 0 3px;
      }
      .nav-badge.hidden { display: none; }

      /* ── Home Tab ── */
      .home-section { padding: 16px 16px 0; }
      .home-section-title {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--dim);
        margin-bottom: 8px;
      }

      .home-game-card {
        background: var(--bg);
        border: 1.5px solid var(--text);
        padding: 12px;
        margin-bottom: 8px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .home-game-top { display: flex; align-items: center; gap: 10px; }
      .home-game-info { flex: 1; min-width: 0; }
      .home-game-opponent { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; line-height: 1.1; }
      .home-game-role { font-size: 11px; color: var(--dim); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.06em; }
      .home-game-role.role-active { color: var(--accent); font-weight: 700; }
      .home-game-line { font-size: 11px; color: var(--dim); margin-top: 2px; }

      .home-game-stands { display: flex; gap: 12px; }
      .skate-letters { display: flex; align-items: center; gap: 2px; }
      .skate-label {
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--dim);
        margin-right: 3px;
      }
      .skate-char {
        width: 22px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
        color: var(--text);
        background: var(--bg);
        border: 1.5px solid var(--text);
      }
      .skate-char.skate-active { color: var(--bg); background: var(--danger); border-color: var(--danger); }

      .home-game-btn {
        padding: 12px;
        border-radius: 0;
        border: 1.5px solid var(--text);
        background: var(--text);
        color: var(--bg);
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        cursor: pointer;
        width: 100%;
        font-family: var(--font);
      }

      .home-invite-card {
        background: var(--bg);
        border: 1.5px solid var(--text);
        padding: 12px;
        margin-bottom: 8px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      .home-invite-card.fade-out { opacity: 0; transform: translateX(40px); }
      .home-invite-row { display: flex; align-items: center; gap: 10px; }
      .home-invite-actions { display: flex; gap: 8px; }
      .home-invite-actions .friend-action-btn { flex: 1; padding: 10px; text-align: center; }

      .home-friend-scroller {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 8px;
        scrollbar-width: none;
      }
      .home-friend-scroller::-webkit-scrollbar { display: none; }
      .home-friend-item {
        flex-shrink: 0;
        width: 80px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }
      .home-friend-name {
        font-size: 11px;
        font-weight: 700;
        color: var(--text);
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .home-challenge-btn {
        padding: 4px 8px;
        border-radius: 0;
        border: 1.5px solid var(--text);
        background: var(--text);
        color: var(--bg);
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        cursor: pointer;
        white-space: nowrap;
        font-family: var(--font);
      }

      .avatar-circle {
        width: 36px;
        height: 36px;
        background: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
        color: var(--bg);
        flex-shrink: 0;
        letter-spacing: 0.04em;
      }
      .avatar-circle.avatar-md { width: 40px; height: 40px; font-size: 12px; }
      .avatar-circle.avatar-lg { width: 48px; height: 48px; font-size: 13px; }

      .home-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 64px 16px;
        gap: 6px;
      }
      .home-empty-icon { display: none; }
      .home-empty-text { font-size: 24px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: -0.01em; }
      .home-empty-hint { font-size: 13px; color: var(--dim); text-align: center; max-width: 260px; line-height: 1.4; }

      .home-sent-invite-card {
        background: var(--bg);
        border: 1.5px solid var(--dim);
        padding: 12px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
        opacity: 0.6;
      }
      .home-sent-invite-card .home-game-info { flex: 1; }
      .home-sent-badge {
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--dim);
        border: 1.5px solid var(--dim);
        padding: 2px 6px;
        white-space: nowrap;
      }

      /* ── Games History Tab ── */
      .history-card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
      }
      .history-card:last-child { border-bottom: none; }
      .history-result {
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 800;
        flex-shrink: 0;
        border: 2px solid var(--text);
      }
      .history-result.win  { background: var(--text); color: var(--bg); }
      .history-result.loss { background: var(--bg);   color: var(--text); }
      .history-info { flex: 1; min-width: 0; }
      .history-opponent { font-size: 15px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .history-letters {
        display: flex;
        gap: 3px;
        margin-top: 4px;
        align-items: center;
      }
      .history-letter-group { display: flex; gap: 2px; align-items: center; }
      .history-letter-sep { font-size: 10px; color: var(--dim); margin: 0 3px; }
      .history-ch {
        font-size: 10px;
        font-weight: 700;
        width: 14px;
        height: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border);
        color: var(--dim);
      }
      .history-ch.lit { border-color: var(--danger); color: var(--danger); }
      .history-date { font-size: 11px; color: var(--dim); white-space: nowrap; flex-shrink: 0; }

      /* ── Game Screen Overlay ── */
      #game-screen {
        position: fixed;
        inset: 0;
        z-index: 300;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        max-width: 480px;
        margin: 0 auto;
      }
      #game-screen.hidden { display: none; }
      #gs-content {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        display: flex;
        flex-direction: column;
        padding: 16px;
        gap: 14px;
      }
      #gs-footer {
        flex-shrink: 0;
        display: none;
        flex-direction: column;
        gap: 8px;
        padding: 12px 16px env(safe-area-inset-bottom, 16px);
        border-top: 1.5px solid var(--text);
        background: var(--bg);
      }
      #gs-footer.active { display: flex; }
      .gs-loading {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--dim);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .gs-back-btn {
        background: none;
        border: none;
        color: var(--dim);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        cursor: pointer;
        padding: 0;
        align-self: flex-start;
        font-family: var(--font);
      }

      /* SKATE bar */
      .gs-skate-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 12px 0;
        border-top: 1.5px solid var(--text);
        border-bottom: 1.5px solid var(--text);
      }
      .gs-skate-side { display: flex; flex-direction: column; align-items: center; gap: 4px; }
      .gs-skate-name {
        font-size: 11px;
        font-weight: 700;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        max-width: 100px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .gs-skate-name.gs-skate-me { color: var(--accent); }
      .gs-vs { font-size: 11px; font-weight: 700; color: var(--dim); letter-spacing: 0.1em; }
      .gs-skate-letters { display: flex; gap: 2px; }
      .gs-skate-ch {
        width: 26px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
        background: var(--bg);
        border: 1.5px solid var(--text);
      }
      .gs-skate-ch.gs-ch-active { color: var(--bg); background: var(--danger); border-color: var(--danger); }
      .gs-skate-ch.gs-ch-stamp { animation: gsStamp 0.4s ease-out; }
      @keyframes gsStamp {
        0% { transform: scale(2); opacity: 0; }
        60% { transform: scale(0.9); }
        100% { transform: scale(1); opacity: 1; }
      }

      .gs-avatar {
        width: 36px;
        height: 36px;
        background: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
        color: var(--bg);
        flex-shrink: 0;
        letter-spacing: 0.04em;
      }

      .gs-title { font-size: 28px; font-weight: 700; color: var(--text); text-align: center; letter-spacing: -0.02em; line-height: 1; }
      .gs-subtitle { font-size: 13px; color: var(--dim); text-align: center; margin-top: -8px; text-transform: uppercase; letter-spacing: 0.06em; }

      /* Trick pills */
      .gs-pill-area, .gs-line-display {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        min-height: 34px;
      }
      .gs-trick-pill {
        padding: 5px 12px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        border: 1.5px solid var(--text);
        background: var(--bg);
        color: var(--dim);
      }
      .gs-pill-current {
        border-color: var(--accent);
        color: var(--accent);
        animation: gsPillBlink 1.4s ease-in-out infinite;
      }
      @keyframes gsPillBlink {
        0%, 100% { border-color: var(--accent); color: var(--accent); }
        50% { border-color: var(--dim); color: var(--dim); }
      }
      .gs-pill-done { border-color: var(--text); background: var(--text); color: var(--bg); }
      .gs-pill-failed { border-color: var(--danger); color: var(--danger); }
      .gs-pill-check { margin-right: 3px; }
      .gs-pill-x { color: var(--danger); margin-right: 3px; }

      .gs-counter { text-align: center; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim); }

      .gs-perm-banner {
        background: var(--bg);
        border: 1.5px solid var(--text);
        padding: 12px;
        font-size: 13px;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .gs-perm-btn {
        margin-left: auto;
        padding: 6px 12px;
        background: var(--text);
        color: var(--bg);
        border: none;
        font-weight: 700;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        cursor: pointer;
        font-family: var(--font);
      }

      .gs-status { text-align: center; font-size: 11px; color: var(--dim); min-height: 1.2em; text-transform: uppercase; letter-spacing: 0.06em; }

      .gs-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: auto;
        padding-top: 12px;
      }
      .gs-record-btn {
        width: 100%;
        padding: 16px;
        border: 2px solid var(--text);
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        cursor: pointer;
        font-family: var(--font);
        border-radius: 0;
      }
      .gs-record-btn:active { opacity: 0.65; }
      .gs-record-btn:disabled { opacity: 0.3; cursor: not-allowed; }
      .gs-btn-recording {
        border-color: var(--danger);
        color: var(--danger);
        animation: gsRecPulse 1.2s ease-in-out infinite;
      }
      @keyframes gsRecPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

      .gs-submit-btn {
        width: 100%;
        padding: 16px;
        border: none;
        background: var(--text);
        color: var(--bg);
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        cursor: pointer;
        font-family: var(--font);
        border-radius: 0;
      }
      .gs-submit-btn:disabled { opacity: 0.35; }

      /* Result screen */
      .gs-result-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        padding: 20px 0;
      }
      .gs-result-icon {
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        font-weight: 800;
        border: 2px solid var(--text);
      }
      .gs-result-icon.gs-result-success { background: var(--text); color: var(--bg); }
      .gs-result-icon.gs-result-fail { background: var(--bg); color: var(--text); }
      .gs-result-title { font-size: 28px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
      .gs-result-text { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; }
      .gs-result-letter {
        font-size: 48px;
        font-weight: 700;
        color: var(--danger);
        animation: gsStamp 0.5s ease-out;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .gs-result-stand { display: flex; gap: 2px; margin: 8px 0; }
      .gs-result-gameover { font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text); margin-top: 8px; }
      .gs-ok-btn {
        width: 100%;
        max-width: 280px;
        padding: 14px;
        border-radius: 0;
        border: none;
        background: var(--text);
        color: var(--bg);
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        cursor: pointer;
        margin-top: 12px;
        font-family: var(--font);
      }

      /* Waiting screen */
      .gs-waiting-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
      }
      .gs-waiting-avatar {
        width: 60px;
        height: 60px;
        background: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--bg);
        letter-spacing: 0.04em;
      }
      .gs-waiting-text { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; }
      .gs-waiting-pulse { display: flex; gap: 6px; }
      .gs-pulse-dot {
        width: 7px;
        height: 7px;
        background: var(--dim);
        animation: gsDotPulse 1.2s ease-in-out infinite;
      }
      @keyframes gsDotPulse {
        0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
        40% { opacity: 1; transform: scale(1.2); }
      }

      /* Trick reference card */
      .gs-trick-ref {
        background: var(--bg);
        border: 1.5px solid var(--text);
        border-left: 4px solid var(--accent);
        padding: 14px 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .gs-trick-ref-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--dim); }
      .gs-trick-ref-name { font-size: 24px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; line-height: 1; }
      .gs-trick-ref-hint { font-size: 13px; color: var(--dim); line-height: 1.4; margin-top: 3px; }

      /* Waiting context */
      .gs-waiting-context {
        background: var(--bg);
        border: 1.5px solid var(--text);
        padding: 12px;
        width: 100%;
        max-width: 320px;
        text-align: center;
      }
      .gs-waiting-context-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--dim); margin-bottom: 8px; }
      .gs-waiting-pills { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
      .gs-waiting-pill {
        padding: 4px 10px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        border: 1.5px solid var(--text);
        color: var(--text);
      }

      /* Detection flash */
      .gs-detect-flash {
        padding: 14px;
        text-align: center;
        animation: gsFlashIn 0.2s ease-out;
        border: 1.5px solid var(--text);
        background: var(--bg);
      }
      .gs-detect-flash.gs-detect-ok { border-left: 4px solid var(--accent); }
      .gs-detect-flash.gs-detect-fail { border-left: 4px solid var(--danger); }
      .gs-detect-trick { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }
      .gs-detect-conf { font-size: 11px; color: var(--dim); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.08em; }
      @keyframes gsFlashIn {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* ── Trick replay (setter) ── */
      .gs-replay-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
      }
      .gs-replay-chip {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--bg);
        background: var(--accent);
        padding: 3px 10px;
        align-self: center;
      }
      .gs-replay-name {
        font-size: 28px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.02em;
        line-height: 1;
        text-align: center;
      }
      .gs-replay-canvas-wrap {
        width: 100%;
        flex: 1;
        min-height: 160px;
        max-height: 300px;
      }
      canvas.gs-replay-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* ── Reference animation (matcher) ── */
      .gs-ref-canvas-wrap {
        width: 100%;
        height: 160px;
        margin: 8px 0 4px;
      }
      canvas.gs-ref-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* ── Toast ── */
      #toast {
        position: fixed;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 60px);
        left: 50%;
        transform: translateX(-50%) translateY(8px);
        background: var(--text);
        color: var(--bg);
        padding: 9px 18px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0;
        transition: opacity 0.2s ease, transform 0.2s ease;
        pointer-events: none;
        z-index: 500;
        white-space: nowrap;
        max-width: calc(100vw - 40px);
        border-radius: 0;
      }
      #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      /* ── Friends Tab ── */
      .requests-banner {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--bg);
        border: 1.5px solid var(--text);
        border-left: 4px solid var(--accent);
        padding: 10px 12px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      .requests-banner-count {
        background: var(--text);
        color: var(--bg);
        font-size: 11px;
        font-weight: 700;
        min-width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        padding: 0 4px;
      }
      .requests-banner-text { font-size: 11px; font-weight: 700; color: var(--text); flex: 1; text-transform: uppercase; letter-spacing: 0.08em; }
      .requests-banner-arrow { color: var(--dim); font-size: 1rem; }

      .friends-section { padding: 16px 16px 8px; }
      .friends-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--dim); margin-bottom: 8px; }

      #friend-search-input {
        width: 100%;
        background: var(--bg);
        border: 1.5px solid var(--text);
        border-radius: 0;
        color: var(--text);
        font-size: 14px;
        font-weight: 500;
        padding: 10px 12px;
        outline: none;
        margin-bottom: 8px;
        font-family: var(--font);
      }
      #friend-search-input:focus { border-color: var(--accent); }
      #friend-search-input::placeholder { color: var(--dim); }

      .friend-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1.5px solid var(--text);
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      .friend-row:last-child { border-bottom: none; }
      .friend-row.fade-out { opacity: 0; transform: translateX(40px); }

      .friend-info { flex: 1; min-width: 0; }
      .friend-name { font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .friend-meta { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; letter-spacing: 0.04em; }

      .request-actions { display: flex; gap: 6px; flex-shrink: 0; }

      .friend-action-btn {
        padding: 6px 10px;
        border: 1.5px solid var(--text);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        cursor: pointer;
        white-space: nowrap;
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        border-radius: 0;
      }
      .friend-action-btn.disabled { opacity: 0.4; cursor: not-allowed; }
      .accent-btn { background: var(--text); color: var(--bg); border-color: var(--text); }
      .accept-btn { background: var(--text); color: var(--bg); border-color: var(--text); }
      .decline-btn { background: var(--bg); border-color: var(--dim); color: var(--dim); }

      .friends-empty { text-align: center; color: var(--dim); font-size: 11px; padding: 20px 0; text-transform: uppercase; letter-spacing: 0.1em; }
      .friends-divider { height: 1.5px; background: var(--text); }

      @media (min-width: 480px) {
        #auth-screen, #app-shell {
          border-left: 1.5px solid var(--text);
          border-right: 1.5px solid var(--text);
        }
      }
    </style>
  </head>
  <body>

    <!-- ════════ AUTH SCREEN ════════ -->
    <div id="auth-screen" class="hidden">
      <div class="auth-logo">
        <img src="/static/flipphone_icon_bw.svg" alt="flipPhone" />
        <p>Flip your phone. Land tricks. Challenge friends.</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab-btn active" data-tab="login">Login</button>
        <button class="auth-tab-btn" data-tab="register">Register</button>
      </div>

      <!-- Login -->
      <form id="login-form" class="auth-form" autocomplete="on">
        <div class="auth-field">
          <label for="login-username">Username</label>
          <input id="login-username" type="text" autocomplete="username" required />
        </div>
        <div class="auth-field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" autocomplete="current-password" required />
        </div>
        <div class="auth-error"></div>
        <button id="login-btn" class="auth-submit-btn" type="submit">Login</button>
      </form>

      <!-- Register -->
      <form id="register-form" class="auth-form hidden" autocomplete="on">
        <div class="auth-field">
          <label for="reg-username">Username</label>
          <input id="reg-username" type="text" autocomplete="username" placeholder="a-z, 0-9, _ (3-20)" required />
          <span id="reg-username-hint" class="field-hint"></span>
        </div>
        <div class="auth-field">
          <label for="reg-display-name">Display Name <span style="font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
          <input id="reg-display-name" type="text" autocomplete="name" />
        </div>
        <div class="auth-field">
          <label for="reg-password">Password</label>
          <input id="reg-password" type="password" autocomplete="new-password" placeholder="min. 8 characters" required />
        </div>
        <div class="auth-field">
          <label for="reg-confirm">Confirm Password</label>
          <input id="reg-confirm" type="password" autocomplete="new-password" required />
        </div>
        <div class="auth-error"></div>
        <button id="register-btn" class="auth-submit-btn" type="submit">Create Account</button>
      </form>
    </div>

    <!-- ════════ APP SHELL ════════ -->
    <div id="app-shell" class="hidden">

      <!-- Top Header -->
      <div class="app-header">
        <div class="app-wordmark">
          <img src="/static/flipphone_icon_bw.svg" alt="flipPhone" />
        </div>
        <button id="header-user-btn" class="header-user-btn">
          <div id="header-avatar" class="header-avatar"></div>
          <span id="header-username" class="header-username"></span>
        </button>
      </div>

      <!-- Home Tab -->
      <div id="tab-home" class="app-tab-content active">
        <div id="home-content"></div>
      </div>

      <!-- Games Tab -->
      <div id="tab-games" class="app-tab-content">
        <div id="games-content"></div>
      </div>

      <!-- Friends Tab -->
      <div id="tab-friends" class="app-tab-content">
        <div class="friends-section" id="requests-banner-section" style="padding-bottom:0">
          <div id="requests-banner" class="requests-banner hidden">
            <span id="requests-banner-count" class="requests-banner-count">0</span>
            <span class="requests-banner-text">Offene Freundschaftsanfragen</span>
            <span class="requests-banner-arrow">›</span>
          </div>
        </div>

        <div class="friends-section">
          <div class="friends-section-title">Nutzer suchen</div>
          <input id="friend-search-input" type="text" placeholder="Username oder Name..." />
          <div id="search-results"></div>
        </div>
        <div class="friends-divider"></div>

        <div class="friends-section" id="requests-section">
          <div class="friends-section-title">Anfragen erhalten</div>
          <div id="requests-list"></div>
        </div>
        <div class="friends-divider"></div>

        <div class="friends-section" id="sent-requests-section">
          <div class="friends-section-title">Anfragen gesendet</div>
          <div id="sent-requests-list"></div>
        </div>
        <div class="friends-divider"></div>

        <div class="friends-section">
          <div class="friends-section-title">Freunde</div>
          <div id="friends-list"></div>
        </div>
      </div>

      <!-- Bottom Navigation -->
      <nav class="bottom-nav">
        <button class="nav-btn active" data-nav="home">
          <span class="nav-icon">&#9750;</span>
          Home
          <span id="games-badge" class="nav-badge hidden"></span>
        </button>
        <button class="nav-btn" data-nav="games">
          <span class="nav-icon">&#9889;</span>
          Spiele
        </button>
        <button class="nav-btn" data-nav="friends">
          <span class="nav-icon">&#9734;</span>
          Freunde
          <span id="requests-badge" class="nav-badge hidden"></span>
        </button>
      </nav>

    </div>

    <!-- ════════ GAME SCREEN (fullscreen overlay) ════════ -->
    <div id="game-screen" class="hidden">
      <div id="gs-content"></div>
      <div id="gs-footer"></div>
    </div>

    <!-- ════════ PROFILE OVERLAY ════════ -->
    <div id="profile-overlay" class="hidden">
      <div class="profile-sheet">
        <button id="profile-close-btn" class="profile-close-btn">&times;</button>
        <div id="profile-avatar" class="profile-avatar-lg"></div>
        <div id="profile-display-name" class="profile-name"></div>
        <div id="profile-handle" class="profile-handle"></div>
        <div class="profile-stats">
          <div class="profile-stat">
            <div id="profile-tricks" class="profile-stat-val">0</div>
            <div class="profile-stat-lbl">Tricks</div>
          </div>
          <div class="profile-stat">
            <div id="profile-wins" class="profile-stat-val">0</div>
            <div class="profile-stat-lbl">Wins</div>
          </div>
          <div class="profile-stat">
            <div id="profile-losses" class="profile-stat-val">0</div>
            <div class="profile-stat-lbl">Losses</div>
          </div>
        </div>
        <button id="profile-logout-btn" class="profile-logout-btn">Logout</button>
      </div>
    </div>

    <div id="toast"></div>

    <script type="module" src="/static/dist/game.js"></script>
  </body>
</html>
