<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d0d0d" />
  <title>FlipPhone – Embeddings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100dvh;
    }

    /* ── Layout ── */
    #embed-root {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    #embed-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(13,13,13,0.95);
      border-bottom: 1px solid #333;
      backdrop-filter: blur(8px);
      flex-shrink: 0;
      z-index: 10;
    }

    #embed-header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #00e5ff;
      flex: 1;
    }

    .back-link {
      color: #888;
      text-decoration: none;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    #auth-status {
      font-size: 0.78rem;
      color: #555;
      white-space: nowrap;
    }
    #auth-status.connected { color: #4caf50; }

    #canvas-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #embed-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── Floating panels ── */
    .embed-panel {
      position: absolute;
      background: rgba(20,20,20,0.92);
      border: 1px solid #333;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      padding: 10px 12px;
    }

    /* Legend – top right */
    #legend {
      top: 10px;
      right: 10px;
      min-width: 130px;
      max-height: calc(100% - 20px);
      overflow-y: auto;
    }
    #legend.hidden { display: none; }

    .legend-title {
      font-size: 0.7rem;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.78rem;
      color: #ddd;
      margin-bottom: 4px;
      cursor: pointer;
      border-radius: 6px;
      padding: 2px 4px;
      transition: background 0.15s;
    }
    .legend-item:last-child { margin-bottom: 0; }
    .legend-item:hover { background: rgba(255,255,255,0.06); }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Info panel – bottom */
    #info-panel {
      bottom: 10px;
      left: 10px;
      right: 10px;
      max-height: 220px;
    }

    #info-hint {
      font-size: 0.75rem;
      color: #555;
      text-align: center;
      padding: 2px 0;
    }

    #info-list {
      overflow-y: auto;
      max-height: 130px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      padding: 5px 0;
      border-bottom: 1px solid #2a2a2a;
    }
    .info-item:last-child { border-bottom: none; }

    .info-trick {
      font-weight: 600;
      color: #00e5ff;
      font-size: 0.85rem;
    }
    .info-meta {
      font-size: 0.72rem;
      color: #666;
      margin-top: 1px;
    }

    #btn-delete {
      width: 100%;
      margin-top: 8px;
      background: #ff4d4d;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    #btn-delete:disabled { opacity: 0.45; cursor: default; }
    #btn-delete.hidden { display: none; }

    /* Status overlay */
    #status-bar {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #555;
      font-size: 0.88rem;
      pointer-events: none;
      text-align: center;
      white-space: nowrap;
    }

    /* ── Auth modal ── */
    #auth-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #auth-modal.hidden { display: none; }

    #auth-sheet {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 24px;
      width: 300px;
      max-width: calc(100vw - 40px);
    }
    #auth-sheet h2 {
      color: #00e5ff;
      margin-bottom: 14px;
      font-size: 1rem;
    }

    #auth-key-input {
      width: 100%;
      background: #242424;
      border: 1px solid #444;
      border-radius: 8px;
      color: #f0f0f0;
      padding: 9px 11px;
      font-size: 0.88rem;
      margin-bottom: 10px;
      outline: none;
    }
    #auth-key-input:focus { border-color: #00e5ff; }

    #auth-submit {
      width: 100%;
      background: #00e5ff;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 9px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 240px;
      left: 50%;
      transform: translateX(-50%);
      background: #242424;
      color: #f0f0f0;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.82rem;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
      z-index: 50;
      white-space: nowrap;
      border: 1px solid #333;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="embed-root">
    <header id="embed-header">
      <a href="/lab/" class="back-link">← Lab</a>
      <h1>🧬 Embeddings</h1>
      <span id="auth-status">not connected</span>
    </header>

    <div id="canvas-wrapper">
      <canvas id="embed-canvas"></canvas>

      <div id="legend" class="embed-panel hidden">
        <div class="legend-title">Tricks</div>
      </div>

      <div id="info-panel" class="embed-panel">
        <div id="info-hint">Click a point to select · Shift+click to multi-select</div>
        <div id="info-list"></div>
        <button id="btn-delete" class="hidden">Delete</button>
      </div>

      <div id="status-bar"></div>
    </div>
  </div>

  <div id="auth-modal" class="hidden">
    <div id="auth-sheet">
      <h2>🔑 API Key</h2>
      <input type="text" id="auth-key-input" placeholder="fp_…"
             autocomplete="off" spellcheck="false" autocapitalize="none" />
      <button id="auth-submit">Connect</button>
    </div>
  </div>

  <div id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="/static/lab/embed.js"></script>
</body>
</html>
