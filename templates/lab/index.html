<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1024">
  <title>Lab — flipPhone</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>

<!-- Login -->
<div id="login">
  <div class="login-box">
    <div class="login-logo">
      <img src="/static/flipphone_icon_bw.svg" alt="flipPhone">
    </div>
    <div class="login-title">Lab</div>
    <form id="login-form">
      <div class="form-row">
        <label for="u">Username</label>
        <input id="u" type="text" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="form-row">
        <label for="p">Password</label>
        <input id="p" type="password" name="password" autocomplete="current-password" required>
      </div>
      <div class="form-row" style="margin-top:20px">
        <button type="submit" class="btn btn-full">Sign in</button>
      </div>
      <div id="login-error" class="error-msg"></div>
    </form>
  </div>
</div>

<!-- App -->
<div id="app">
  <header class="header">
    <a class="wordmark" href="/lab/">
      <img src="/static/flipphone_icon_bw.svg" alt="flipPhone">
      <span class="wordmark-label">Lab</span>
    </a>
    <nav class="nav-links">
      <a href="/lab/" class="active">Recordings</a>
      <a href="/lab/record">Record</a>
      <a href="/lab/playground">Playground</a>
    </nav>
    <div class="header-right">
      <span id="logged-in-as"></span>
      <button class="btn btn-ghost btn-sm" id="logout-btn">Logout</button>
    </div>
  </header>

  <main class="main">
    <div class="page-heading">
      Recordings
      <select id="trick-filter" class="trick-filter" style="margin-left:16px;font-size:0.82rem;padding:4px 8px;border:1.5px solid var(--border);background:var(--bg);cursor:pointer;">
        <option value="">All tricks</option>
      </select>
    </div>
    <table class="data-table">
      <thead>
        <tr>
          <th>Trick</th>
          <th>Collector</th>
          <th>Duration</th>
          <th>Samples</th>
          <th>Date</th>
          <th style="width:52px">Ref</th>
          <th style="width:80px"></th>
        </tr>
      </thead>
      <tbody id="rec-tbody">
        <tr><td colspan="7" class="table-msg">Loading…</td></tr>
      </tbody>
    </table>
  </main>
</div>

<script>
const TOKEN_KEY = 'fp_game_token';
let allRecordings = [];
let refByTrick = {};   // trick → recording_id

function token() { return localStorage.getItem(TOKEN_KEY); }

function showLogin(err) {
  document.getElementById('login').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  if (err) document.getElementById('login-error').textContent = err;
}

function showApp(username) {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  if (username) document.getElementById('logged-in-as').textContent = username;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmtDuration(ms) {
  return (ms / 1000).toFixed(2) + 's';
}

function fmtDate(iso) {
  return iso ? iso.replace('T', ' ').slice(0, 16) : '';
}

function populateTrickFilter(recordings) {
  const sel = document.getElementById('trick-filter');
  const tricks = [...new Set(recordings.map(r => r.trick))].sort();
  tricks.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t;
    sel.appendChild(opt);
  });
}

function renderTable(recordings) {
  const tbody = document.getElementById('rec-tbody');
  if (!recordings.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="table-msg">No recordings.</td></tr>';
    return;
  }
  tbody.innerHTML = recordings.map(r => {
    const isRef = refByTrick[r.trick] === r.id;
    const refBtn = isRef
      ? `<button class="btn btn-sm ref-btn" data-id="${esc(r.id)}" data-trick="${esc(r.trick)}" data-is-ref="1" title="Remove reference">★</button>`
      : `<button class="btn btn-sm btn-ghost ref-btn" data-id="${esc(r.id)}" data-trick="${esc(r.trick)}" data-is-ref="0" title="Set as reference">☆</button>`;
    return `
    <tr data-id="${esc(r.id)}">
      <td><strong>${esc(r.trick)}</strong></td>
      <td>${esc(r.collector || '—')}</td>
      <td>${fmtDuration(r.duration_ms)}</td>
      <td>${r.sample_count}</td>
      <td>${fmtDate(r.created_at)}</td>
      <td>${refBtn}</td>
      <td>
        <button class="btn btn-sm btn-danger delete-btn" data-id="${esc(r.id)}">Delete</button>
      </td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', () => deleteRecording(btn.dataset.id, btn));
  });
  tbody.querySelectorAll('.ref-btn').forEach(btn => {
    btn.addEventListener('click', () => toggleRef(btn));
  });
}

function applyFilter() {
  const trick = document.getElementById('trick-filter').value;
  renderTable(trick ? allRecordings.filter(r => r.trick === trick) : allRecordings);
}

async function toggleRef(btn) {
  const { id, trick } = btn.dataset;
  const isRef = btn.dataset.isRef === '1';
  btn.disabled = true;
  if (isRef) {
    const r = await fetch(`/lab/api/references/${encodeURIComponent(trick)}`, {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + token() },
    }).catch(() => null);
    if (r && r.ok) {
      delete refByTrick[trick];
      applyFilter();
    }
  } else {
    const r = await fetch(`/lab/api/references/${encodeURIComponent(trick)}`, {
      method: 'PUT',
      headers: { Authorization: 'Bearer ' + token(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ recording_id: id }),
    }).catch(() => null);
    if (r && r.ok) {
      refByTrick[trick] = id;
      applyFilter();
    }
  }
  btn.disabled = false;
}

async function deleteRecording(id, btn) {
  if (!confirm('Delete this recording?')) return;
  btn.disabled = true;
  const r = await fetch(`/lab/api/recordings/${encodeURIComponent(id)}`, {
    method: 'DELETE',
    headers: { Authorization: 'Bearer ' + token() },
  }).catch(() => null);

  if (r && r.ok) {
    allRecordings = allRecordings.filter(rec => rec.id !== id);
    applyFilter();
  } else {
    btn.disabled = false;
    alert('Delete failed.');
  }
}

async function loadRecordings() {
  const headers = { Authorization: 'Bearer ' + token() };
  const [recResp, refResp] = await Promise.all([
    fetch('/lab/api/recordings', { headers }).catch(() => null),
    fetch('/lab/api/references',  { headers }).catch(() => null),
  ]);

  if (!recResp) {
    document.getElementById('rec-tbody').innerHTML =
      '<tr><td colspan="7" class="table-msg" style="color:var(--danger)">Network error.</td></tr>';
    return;
  }
  if (recResp.status === 401 || recResp.status === 403) {
    localStorage.removeItem(TOKEN_KEY);
    showLogin('Session expired. Please sign in again.');
    return;
  }
  if (!recResp.ok) {
    document.getElementById('rec-tbody').innerHTML =
      '<tr><td colspan="7" class="table-msg" style="color:var(--danger)">Failed to load recordings.</td></tr>';
    return;
  }

  if (refResp && refResp.ok) {
    const refs = await refResp.json();
    refByTrick = Object.fromEntries(Object.entries(refs).map(([t, r]) => [t, r.id]));
  }

  allRecordings = await recResp.json();
  populateTrickFilter(allRecordings);
  renderTable(allRecordings);
}

async function checkAuth() {
  const t = token();
  if (!t) { showLogin(); return; }

  const r = await fetch('/game/api/auth/me', {
    headers: { Authorization: 'Bearer ' + t },
  }).catch(() => null);

  if (!r || !r.ok) {
    localStorage.removeItem(TOKEN_KEY);
    showLogin();
    return;
  }

  const me = await r.json();
  if (me.role !== 'lab' && me.role !== 'admin') {
    localStorage.removeItem(TOKEN_KEY);
    showLogin('Account does not have Lab access.');
    return;
  }

  showApp(me.username);
  loadRecordings();
}

document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';

  const fd = new FormData(e.target);
  const r = await fetch('/game/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: fd.get('username'), password: fd.get('password') }),
  }).catch(() => null);

  if (!r) { errEl.textContent = 'Network error.'; return; }
  const data = await r.json();
  if (!r.ok) { errEl.textContent = data.error || 'Login failed.'; return; }

  const me = data.user;
  if (me.role !== 'lab' && me.role !== 'admin') {
    errEl.textContent = 'Account does not have Lab access.';
    return;
  }

  localStorage.setItem(TOKEN_KEY, data.token);
  showApp(me.username);
  loadRecordings();
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  const t = token();
  if (t) {
    await fetch('/game/api/auth/logout', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + t },
    }).catch(() => {});
    localStorage.removeItem(TOKEN_KEY);
  }
  showLogin();
});

document.getElementById('trick-filter').addEventListener('change', applyFilter);

checkAuth();
</script>
</body>
</html>
